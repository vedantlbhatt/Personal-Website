<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>RideGT font options</title>
  <style>
    :root {
      --bg: #000; --card: #111; --text: #fff; --muted: #8a8a8a; --accent: #f97316;
      --font: "SF Pro Text", -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh; background: var(--bg); color: var(--text);
      font-family: var(--font); padding: clamp(1.5rem, 4vw, 3rem);
    }
    h1 { font-size: 1.1rem; font-weight: 500; color: var(--muted); margin-bottom: 0.4rem; }
    .sub { color: #bdbdbd; margin-bottom: 1.75rem; max-width: 42rem; line-height: 1.45; font-size: 0.95rem; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 1rem; }
    .option {
      background: var(--card); border: 1px solid #2a2a2a; border-radius: 1.5rem;
      padding: 1.5rem 1.25rem 1.15rem; text-align: left; cursor: pointer;
      color: inherit; font: inherit; transition: border-color 150ms, transform 150ms;
    }
    .option:hover { border-color: #555; transform: translateY(-1px); }
    .option.selected { border-color: var(--accent); }
    .lockup {
      display: flex; align-items: center; justify-content: center; gap: 0.7rem;
      min-height: 5.5rem; margin-bottom: 1rem;
    }
    .mark { width: 3.6rem; height: 3.6rem; object-fit: contain; }
    .word { height: 2.1rem; width: auto; object-fit: contain; }
    .meta { display: flex; flex-direction: column; gap: 0.25rem; }
    .meta strong { font-size: 0.95rem; font-weight: 600; }
    .meta span { font-size: 0.85rem; color: var(--muted); }
    .tag {
      display: inline-block; margin-left: 0.35rem; padding: 0.1rem 0.4rem;
      border-radius: 999px; font-size: 0.7rem; font-style: normal; font-weight: 600;
      background: #222; color: #cfcfcf; vertical-align: middle;
    }
    .tag.fav { background: rgba(249,115,22,0.2); color: #fb923c; }
    .pick { margin-top: 1.5rem; color: var(--muted); font-size: 0.9rem; }
    .pick b { color: #fff; }
  </style>
  <!-- Vercel Web Analytics -->
  <script>
    window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };
  </script>
  <script defer src="/_vercel/insights/script.js"></script>
</head>
<body>
  <h1>RideGT wordmark — 15 font ideas</h1>
  <p class="sub">Kept 1–10. New <b style="color:#fff;font-weight:600">11–15</b> lean into the uneven / quirky energy of #5 (no curls or fancy loops).</p>
  <div class="grid">
    <button class="option" data-id="1" type="button">
      <div class="lockup">
        <img class="mark" src="assets/rehaul/bus-app-icon-white.png" alt="" />
        <img class="word" src="assets/rehaul/ridegt-font-options/ridegt-1.png" alt="RideGT" />
      </div>
      <div class="meta">
        <strong>1. Arial Rounded Bold</strong>
        <span>Soft, friendly, approachable</span>
      </div>
    </button>
    <button class="option" data-id="2" type="button">
      <div class="lockup">
        <img class="mark" src="assets/rehaul/bus-app-icon-white.png" alt="" />
        <img class="word" src="assets/rehaul/ridegt-font-options/ridegt-2.png" alt="RideGT" />
      </div>
      <div class="meta">
        <strong>2. Avenir Next Heavy</strong>
        <span>Modern, thick, clean tech</span>
      </div>
    </button>
    <button class="option" data-id="3" type="button">
      <div class="lockup">
        <img class="mark" src="assets/rehaul/bus-app-icon-white.png" alt="" />
        <img class="word" src="assets/rehaul/ridegt-font-options/ridegt-3.png" alt="RideGT" />
      </div>
      <div class="meta">
        <strong>3. Futura Bold</strong>
        <span>Geometric, confident, simple</span>
      </div>
    </button>
    <button class="option" data-id="4" type="button">
      <div class="lockup">
        <img class="mark" src="assets/rehaul/bus-app-icon-white.png" alt="" />
        <img class="word" src="assets/rehaul/ridegt-font-options/ridegt-4.png" alt="RideGT" />
      </div>
      <div class="meta">
        <strong>4. Arial Black</strong>
        <span>Ultra-bold, loud, punchy</span>
      </div>
    </button>
    <button class="option" data-id="5" type="button">
      <div class="lockup">
        <img class="mark" src="assets/rehaul/bus-app-icon-white.png" alt="" />
        <img class="word" src="assets/rehaul/ridegt-font-options/ridegt-5.png" alt="RideGT" />
      </div>
      <div class="meta">
        <strong>5. Gill Sans UltraBold <em class="tag fav">liked</em></strong>
        <span>Warm, uneven, quirky — your favorite</span>
      </div>
    </button>
    <button class="option" data-id="6" type="button">
      <div class="lockup">
        <img class="mark" src="assets/rehaul/bus-app-icon-white.png" alt="" />
        <img class="word" src="assets/rehaul/ridegt-font-options/ridegt-6.png" alt="RideGT" />
      </div>
      <div class="meta">
        <strong>6. Gill Sans Bold</strong>
        <span>Same family as #5, dialed back</span>
      </div>
    </button>
    <button class="option" data-id="7" type="button">
      <div class="lockup">
        <img class="mark" src="assets/rehaul/bus-app-icon-white.png" alt="" />
        <img class="word" src="assets/rehaul/ridegt-font-options/ridegt-7.png" alt="RideGT" />
      </div>
      <div class="meta">
        <strong>7. Gill Sans SemiBold</strong>
        <span>Warm like #5, lighter still</span>
      </div>
    </button>
    <button class="option" data-id="8" type="button">
      <div class="lockup">
        <img class="mark" src="assets/rehaul/bus-app-icon-white.png" alt="" />
        <img class="word" src="assets/rehaul/ridegt-font-options/ridegt-8.png" alt="RideGT" />
      </div>
      <div class="meta">
        <strong>8. Avenir Black</strong>
        <span>Thick + friendly, less chunky than #5</span>
      </div>
    </button>
    <button class="option" data-id="9" type="button">
      <div class="lockup">
        <img class="mark" src="assets/rehaul/bus-app-icon-white.png" alt="" />
        <img class="word" src="assets/rehaul/ridegt-font-options/ridegt-9.png" alt="RideGT" />
      </div>
      <div class="meta">
        <strong>9. Avenir Heavy</strong>
        <span>Solid weight, soft humanist feel</span>
      </div>
    </button>
    <button class="option" data-id="10" type="button">
      <div class="lockup">
        <img class="mark" src="assets/rehaul/bus-app-icon-white.png" alt="" />
        <img class="word" src="assets/rehaul/ridegt-font-options/ridegt-10.png" alt="RideGT" />
      </div>
      <div class="meta">
        <strong>10. Avenir Next Bold</strong>
        <span>Clean modern bold, not overbuilt</span>
      </div>
    </button>
    <button class="option" data-id="11" type="button">
      <div class="lockup">
        <img class="mark" src="assets/rehaul/bus-app-icon-white.png" alt="" />
        <img class="word" src="assets/rehaul/ridegt-font-options/ridegt-11.png" alt="RideGT" />
      </div>
      <div class="meta">
        <strong>11. Phosphate Solid <em class="tag">quirky</em></strong>
        <span>Weird in a good way, thick display quirks</span>
      </div>
    </button>
    <button class="option" data-id="12" type="button">
      <div class="lockup">
        <img class="mark" src="assets/rehaul/bus-app-icon-white.png" alt="" />
        <img class="word" src="assets/rehaul/ridegt-font-options/ridegt-12.png" alt="RideGT" />
      </div>
      <div class="meta">
        <strong>12. American Typewriter Bold <em class="tag">quirky</em></strong>
        <span>Uneven, mechanical, personable</span>
      </div>
    </button>
    <button class="option" data-id="13" type="button">
      <div class="lockup">
        <img class="mark" src="assets/rehaul/bus-app-icon-white.png" alt="" />
        <img class="word" src="assets/rehaul/ridegt-font-options/ridegt-13.png" alt="RideGT" />
      </div>
      <div class="meta">
        <strong>13. Chalkboard SE Bold <em class="tag">quirky</em></strong>
        <span>Hand-drawn energy, soft quirks</span>
      </div>
    </button>
    <button class="option" data-id="14" type="button">
      <div class="lockup">
        <img class="mark" src="assets/rehaul/bus-app-icon-white.png" alt="" />
        <img class="word" src="assets/rehaul/ridegt-font-options/ridegt-14.png" alt="RideGT" />
      </div>
      <div class="meta">
        <strong>14. Impact <em class="tag">quirky</em></strong>
        <span>Compressed, imperfect, loud</span>
      </div>
    </button>
    <button class="option" data-id="15" type="button">
      <div class="lockup">
        <img class="mark" src="assets/rehaul/bus-app-icon-white.png" alt="" />
        <img class="word" src="assets/rehaul/ridegt-font-options/ridegt-15.png" alt="RideGT" />
      </div>
      <div class="meta">
        <strong>15. Helvetica Neue Condensed Black <em class="tag">quirky</em></strong>
        <span>Tight, heavy, a little off-kilter</span>
      </div>
    </button></div>
  <p class="pick">Selected: <b id="sel">none yet</b></p>
  <script>
    document.querySelectorAll('.option').forEach((btn) => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.option').forEach((b) => b.classList.remove('selected'));
        btn.classList.add('selected');
        document.getElementById('sel').textContent = btn.querySelector('strong').childNodes[0].textContent.trim();
      });
    });
  </script>
</body>
</html>
